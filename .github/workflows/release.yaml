name: Release
# Every push to main (a merged pull request or a direct push) becomes a release:
#   1. the next version is worked out from the commits since the last tag (semantic versioning),
#   2. tests and lint run, and a signed, optimised release APK is built with that version,
#   3. the commit is tagged and a GitHub release is published with notes and the APK attached.
# Version bump, from the commit messages since the last release (Conventional Commits):
#   "feat!: …" or "BREAKING CHANGE" → major · "feat: …" → minor · anything else → patch.
# Commits that only touch docs or CI ("docs:", "ci:", "chore:" and nothing else) don't make a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          range=${last:+$last..HEAD}
          subjects=$(git log --format=%s ${range:-HEAD})
          bodies=$(git log --format=%B ${range:-HEAD})
          if [ -z "$subjects" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Nothing but docs/ci/chore commits: no release.
          if ! echo "$subjects" | grep -qvE '^(docs|ci|chore)(\(.+\))?: '; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          cur=${last#v}; cur=${cur:-0.0.0}
          IFS=. read -r ma mi pa <<< "$cur"
          if echo "$bodies" | grep -q 'BREAKING CHANGE' || echo "$subjects" | grep -qE '^[a-z]+(\(.+\))?!: '; then ma=$((ma+1)); mi=0; pa=0
          elif echo "$subjects" | grep -qE '^feat(\(.+\))?: '; then mi=$((mi+1)); pa=0
          else pa=$((pa+1)); fi
          next="v$ma.$mi.$pa"
          echo "Last: ${last:-none}  Next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        env:
          LAST: ${{ steps.version.outputs.last }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          range=${LAST:+$LAST..HEAD}
          section() { # title, pattern
            lines=$(git log --format='%s' ${range:-HEAD} | grep -E "$2" | sed -E 's/^[a-z]+(\(.+\))?!?: //' | sed 's/^/- /')
            if [ -n "$lines" ]; then printf '### %s\n%s\n\n' "$1" "$lines"; fi
          }
          {
            echo "## RailWatch ${TAG#v}"; echo
            section "New" '^feat(\(.+\))?!?: '
            section "Fixes" '^fix(\(.+\))?!?: '
            section "Improvements" '^(perf|refactor|style)(\(.+\))?!?: '
            other=$(git log --format='%s' ${range:-HEAD} | grep -vE '^(feat|fix|perf|refactor|style|docs|ci|chore|test|build)(\(.+\))?!?: ' | sed 's/^/- /')
            if [ -n "$other" ]; then printf '### Changes\n%s\n\n' "$other"; fi
            echo "### Install"
            echo "Download \`RailWatch-${TAG#v}.apk\` below and open it on your Android phone (Android 8.0 or newer). Allow installing from your browser or Files app when asked. Installing over an earlier release keeps your data."
            if [ -n "$LAST" ]; then echo; echo "**Full changes:** https://github.com/${{ github.repository }}/compare/$LAST...$TAG"; fi
          } > notes.md
          cat notes.md

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        if: steps.version.outputs.skip != 'true'

      - name: Signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RAILWATCH_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build the release APK
        if: steps.version.outputs.skip != 'true'
        env:
          RAILWATCH_KEYSTORE: ${{ runner.temp }}/release.jks
          RAILWATCH_STORE_PASSWORD: ${{ secrets.RAILWATCH_STORE_PASSWORD }}
          RAILWATCH_KEY_ALIAS: ${{ secrets.RAILWATCH_KEY_ALIAS }}
          RAILWATCH_KEY_PASSWORD: ${{ secrets.RAILWATCH_KEY_PASSWORD }}
        run: |
          ./gradlew :shared:jvmTest :androidApp:lintRelease :androidApp:assembleRelease -PappVersion=${{ steps.version.outputs.tag }} --console=plain
          v=${{ steps.version.outputs.tag }}
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "RailWatch-${v#v}.apk"
          # Refuse to publish an APK that isn't signed with the release key.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "RailWatch-${v#v}.apk" | grep -q "CN=Harish T"
          sha256sum "RailWatch-${v#v}.apk" > "RailWatch-${v#v}.apk.sha256"

      - name: Tag and publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "RailWatch-${TAG#v}.apk" "RailWatch-${TAG#v}.apk.sha256" --title "RailWatch ${TAG#v}" --notes-file notes.md --latest
