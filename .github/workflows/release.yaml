name: Release
# Every merge to main becomes a release:
#   1. the version bump comes from the merged pull request's label: release: major, release: minor or release: patch
#      (skip-release: merge without releasing; a direct push to main counts as patch),
#   2. tests and lint run, and a signed, optimised release APK is built with that version,
#   3. the commit is tagged vX.Y.Z and a GitHub release is published with GitHub's generated notes
#      (merged pull requests grouped by label, see .github/release.yml, plus contributors and a full-changes link),
#      the APK and its SHA-256 checksum.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ inputs.bump }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          pr=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          if echo "$labels" | grep -qx 'skip-release'; then echo "PR #$pr is labelled skip-release"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A direct push (no pull request) can opt out with [skip release] in its message.
          if [ -z "$pr" ] && [ -z "$MANUAL" ] && git log -1 --format=%B | grep -qi '\[skip release\]'; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$MANUAL" ]; then bump=$MANUAL
          elif echo "$labels" | grep -qx 'release: major'; then bump=major
          elif echo "$labels" | grep -qx 'release: minor'; then bump=minor
          else bump=patch; fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          IFS=. read -r ma mi pa <<< "${last#v}"
          case $bump in major) ma=$((ma+1)); mi=0; pa=0;; minor) mi=$((mi+1)); pa=0;; *) pa=$((pa+1));; esac
          next="v$ma.$mi.$pa"
          echo "PR: ${pr:-none (direct push)}  labels: ${labels:-none}  bump: $bump  $last -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        if: steps.version.outputs.skip != 'true'

      - name: Signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RAILWATCH_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build the release APK
        if: steps.version.outputs.skip != 'true'
        env:
          RAILWATCH_KEYSTORE: ${{ runner.temp }}/release.jks
          RAILWATCH_STORE_PASSWORD: ${{ secrets.RAILWATCH_STORE_PASSWORD }}
          RAILWATCH_KEY_ALIAS: ${{ secrets.RAILWATCH_KEY_ALIAS }}
          RAILWATCH_KEY_PASSWORD: ${{ secrets.RAILWATCH_KEY_PASSWORD }}
        run: |
          ./gradlew :shared:jvmTest :androidApp:lintRelease :androidApp:assembleRelease -PappVersion=${{ steps.version.outputs.tag }} --console=plain
          v=${{ steps.version.outputs.tag }}
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "RailWatch-${v#v}.apk"
          # Refuse to publish an APK that isn't signed with the release key.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "RailWatch-${v#v}.apk" | grep -q "CN=Harish T"
          sha256sum "RailWatch-${v#v}.apk" > "RailWatch-${v#v}.apk.sha256"

      - name: Tag and publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          printf '%s\n\n' "**Install:** download \`RailWatch-${TAG#v}.apk\` below and open it on your Android phone (Android 8.0 or newer). Installing over an earlier release keeps your data. Check the download against \`RailWatch-${TAG#v}.apk.sha256\` if you like." > notes.md
          gh release create "$TAG" "RailWatch-${TAG#v}.apk" "RailWatch-${TAG#v}.apk.sha256" --title "$TAG" --notes-file notes.md --generate-notes --latest
