name: CI
# Checks pull requests and branch pushes; main is checked (and released) by release.yaml.
on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests, lint and debug APK
        run: ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: railwatch-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
  version-label:
    # Every pull request needs exactly one of major / minor / patch / skip-release: it sets the next version.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Exactly one version label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          n=0; for l in $LABELS; do case $l in major|minor|patch|skip-release) n=$((n+1));; esac; done
          if [ "$n" -ne 1 ]; then
            echo "::error::Add exactly one label: major (breaking), minor (new feature), patch (fix or improvement) or skip-release. Found: ${LABELS:-none}"
            exit 1
          fi
          echo "Version label OK: $LABELS"
