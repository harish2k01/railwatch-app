# Groups GitHub's generated release notes by the pull request's version label.
changelog:
  exclude:
    labels: [skip-release]
  categories:
    - title: Breaking changes
      labels: ["release: major"]
    - title: New
      labels: ["release: minor"]
    - title: Fixes and improvements
      labels: ["release: patch"]
    - title: Other changes
      labels: ["*"]
