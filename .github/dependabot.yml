# Weekly dependency update pull requests (Gradle updates are labelled release: patch; GitHub Actions updates skip-release).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    labels: ["release: patch", dependencies]
    groups:
      androidx: { patterns: ["androidx.*"] }
      kotlin: { patterns: ["org.jetbrains.kotlin*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [skip-release, dependencies]
